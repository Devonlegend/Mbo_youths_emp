<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>{{ subject }}</title>
  <style>
    /* Gmail app note: this block may be stripped in some contexts.
       Critical styles are also inlined below as a fallback. */
    body {
      margin: 0; padding: 0;
      background-color: #f8fafc;
      font-family: 'Inter', Arial, Helvetica, sans-serif;
      font-size: 14px; line-height: 1.65;
      color: #374151;
      -webkit-font-smoothing: antialiased;
    }
    table { border-collapse: collapse; }
    img { border: 0; outline: none; text-decoration: none; }

    .email-wrapper {
      max-width: 560px; margin: 32px auto;
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      overflow: hidden;
    }

    /* ── HEADER ── */
    .email-header-cell {
      padding: 28px 32px 24px;
      border-bottom: 1px solid #f1f5f9;
    }
    .email-logo-img {
      width: 40px; height: 40px;
      border-radius: 50%;
      display: block;
    }
    .email-brand h1 {
      margin: 0;
      font-family: 'Plus Jakarta Sans', Arial, Helvetica, sans-serif;
      font-weight: 800; font-size: 14.5px;
      color: #0f172a; letter-spacing: -0.02em;
    }
    .email-brand p {
      margin: 2px 0 0;
      font-size: 11.5px; color: #94a3b8;
    }

    /* ── STATUS STRIP ── */
    .status-strip-cell {
      padding: 16px 32px;
      border-bottom: 1px solid;
    }
    .status-strip-icon {
      width: 32px; height: 32px;
      border-radius: 9px;
      background: #ffffff;
      border: 1px solid;
      font-family: 'Plus Jakarta Sans', Arial, Helvetica, sans-serif;
      font-weight: 800; font-size: 15px;
      line-height: 32px;
      text-align: center;
    }
    .status-strip-text {
      font-size: 12.5px; font-weight: 700;
      letter-spacing: -0.01em;
    }
    .status-strip--green { background: #f0fdf4; border-color: #bbf7d0; }
    .status-strip--green .status-strip-icon { border-color: #bbf7d0; color: #15803d; }
    .status-strip--green .status-strip-text { color: #166534; }

    .status-strip--amber { background: #fffbeb; border-color: #fde68a; }
    .status-strip--amber .status-strip-icon { border-color: #fde68a; color: #f59e0b; }
    .status-strip--amber .status-strip-text { color: #92400e; }

    .status-strip--red { background: #fef2f2; border-color: #fecaca; }
    .status-strip--red .status-strip-icon { border-color: #fecaca; color: #ef4444; }
    .status-strip--red .status-strip-text { color: #b91c1c; }

    .status-strip--blue { background: #eff6ff; border-color: #bfdbfe; }
    .status-strip--blue .status-strip-icon { border-color: #bfdbfe; color: #3b82f6; }
    .status-strip--blue .status-strip-text { color: #1e40af; }

    /* ── BODY ── */
    .email-body { padding: 32px; }
    .email-body h2 {
      margin: 0 0 12px;
      font-family: 'Plus Jakarta Sans', Arial, Helvetica, sans-serif;
      font-weight: 800; font-size: 19px;
      color: #0f172a; letter-spacing: -0.02em;
    }
    .email-body p { margin: 0 0 14px; }
    .email-body p:last-child { margin-bottom: 0; }

    /* ── REFERENCE PILL ── */
    .reference {
      display: inline-block;
      margin: 2px 0 18px;
      background: #f1f5f9;
      color: #374151;
      border: 1px solid #e2e8f0;
      padding: 6px 12px; border-radius: 8px;
      font-size: 12px; font-weight: 600;
      font-family: 'SFMono-Regular', Consolas, monospace;
      letter-spacing: 0.02em;
    }

    /* ── DETAIL TABLE ── */
    .detail-table {
      width: 100%; border-collapse: collapse;
      margin: 4px 0 20px;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      overflow: hidden;
    }
    .detail-table tr { border-bottom: 1px solid #f1f5f9; }
    .detail-table tr:last-child { border-bottom: none; }
    .detail-table td { padding: 12px 16px; vertical-align: top; }
    .detail-table td:first-child {
      width: 140px; font-weight: 600; font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.06em;
      color: #94a3b8;
      background: #f1f5f9;
    }
    .detail-table td:last-child {
      font-size: 13px; font-weight: 600; color: #0f172a;
    }

    /* ── INFO BOXES ── */
    .info-box {
      margin: 4px 0 20px; padding: 14px 18px;
      border-radius: 12px; border: 1px solid;
      font-size: 13px; line-height: 1.6;
    }
    .info-box strong { font-weight: 700; }
    .info-box--green { background: #f0fdf4; border-color: #bbf7d0; color: #166534; }
    .info-box--red   { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }
    .info-box--amber { background: #fffbeb; border-color: #fde68a; color: #92400e; }
    .info-box--blue  { background: #eff6ff; border-color: #bfdbfe; color: #1e40af; }

    /* ── CTA BUTTON ── */
    .cta-wrap { text-align: center; margin: 24px 0 4px; }
    .cta-button {
      display: inline-block;
      background: #15803d;
      color: #ffffff !important; text-decoration: none;
      padding: 13px 30px; border-radius: 10px;
      font-family: 'Plus Jakarta Sans', Arial, Helvetica, sans-serif;
      font-weight: 700; font-size: 13.5px;
      letter-spacing: -0.01em;
    }

    /* ── OTP ── */
    .otp-wrap { text-align: center; margin: 20px 0; }
    .otp-code {
      display: inline-block;
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 30px; font-weight: 800;
      letter-spacing: 8px; color: #0f172a;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      padding: 14px 26px; border-radius: 12px;
    }
    .otp-expiry {
      text-align: center; color: #94a3b8;
      font-size: 12.5px; margin-top: -10px;
    }

    /* ── FINE PRINT ── */
    .fine-print {
      font-size: 12px; color: #94a3b8;
      margin-top: 20px;
    }
    .fine-print a { color: #15803d; text-decoration: none; font-weight: 600; }

    /* ── FOOTER ── */
    .email-footer {
      padding: 20px 32px;
      background: #f1f5f9;
      border-top: 1px solid #e2e8f0;
      text-align: center;
    }
    .email-footer p { margin: 0; font-size: 12px; color: #94a3b8; }
    .email-footer a { color: #15803d; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body style="margin:0; padding:0; background-color:#f8fafc; font-family: Arial, Helvetica, sans-serif; font-size:14px; line-height:1.65; color:#374151;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f8fafc;">
    <tr>
      <td align="center" style="padding: 0 16px;">

        <table role="presentation" class="email-wrapper" width="560" cellpadding="0" cellspacing="0" border="0"
          style="max-width:560px; width:100%; margin:32px auto; background-color:#ffffff; border:1px solid #e2e8f0; border-radius:20px; overflow:hidden;">

          <!-- HEADER -->
          <tr>
            <td class="email-header-cell" style="padding:28px 32px 24px; border-bottom:1px solid #f1f5f9;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="padding-right:12px; vertical-align:middle;">
                    <img
                      src="https://res.cloudinary.com/dwn6p3qmd/image/upload/f_auto,q_auto,w_80,h_80,c_fill,g_face,r_max/v1784673040/mboyouths_ssedqs.png"
                      alt="RMHCDT Youth Portal"
                      class="email-logo-img"
                      width="40" height="40"
                      style="width:40px; height:40px; border-radius:50%; display:block;"
                    />
                  </td>
                  <td class="email-brand" style="vertical-align:middle;">
                    <h1 style="margin:0; font-family: Arial, Helvetica, sans-serif; font-weight:800; font-size:14.5px; color:#0f172a; letter-spacing:-0.02em;">RMHCDT Youth Portal</h1>
                    <p style="margin:2px 0 0; font-size:11.5px; color:#94a3b8;">Royal Mbo Host Community Development Trust</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          {% block status_strip %}{% endblock %}

          <!-- BODY -->
          <tr>
            <td class="email-body" style="padding:32px;">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <!-- FOOTER -->
          <tr>
            <td class="email-footer" style="padding:20px 32px; background:#f1f5f9; border-top:1px solid #e2e8f0; text-align:center;">
              <p style="margin:0; font-size:12px; color:#94a3b8;">
                &copy; Royal Mbo Host Community Development Trust<br>
                <a href="{{ portal_url }}" style="color:#15803d; text-decoration:none; font-weight:600;">RMHCDT Youth Portal</a>
                &ensp;&middot;&ensp;
                <a href="mailto:{{ support_email }}" style="color:#15803d; text-decoration:none; font-weight:600;">{{ support_email }}</a>
              </p>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>
</body>
</html>
