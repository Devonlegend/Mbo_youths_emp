# Mbo Youth Empowerment — full production stack (frontend + backend +
# redis + celery worker). PostgreSQL is a Coolify-managed database resource,
# not a container in this file. Deploy the whole stack on a VPS with:
#     docker compose up -d --build
# All runtime config lives in the root `.env` (see `.env.example`).
# This file is also the single resource you import into Coolify.

name: mbo-portal

services:
  # ── Next.js frontend ──────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Read at runtime by the /api/proxy route. Same-network call avoids a
      # public round-trip. For a Render-hosted frontend, point this at
      # https://back.mboempowerment.com instead.
      BACKEND_URL: ${BACKEND_URL:-http://backend:8080}
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - default
      - coolify
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── PostgreSQL ────────────────────────────────────────────────────────
  # Managed by Coolify as a standalone database resource. Set DB_HOST to the
  # database's Internal URL hostname (Configuration > General), and make sure
  # this compose resource can reach its destination network (Advanced >
  # Connect To Predefined Network). Do NOT run a db container here.

  # ── Redis (Celery broker) ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── Django / gunicorn ─────────────────────────────────────────────────
  backend:
    build:
      context: ./mbo_youth_emp
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      CELERY_BROKER_URL: redis://redis:6379/0
      # Everything else comes from the root .env
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-back.mboempowerment.com},localhost,127.0.0.1"
      NIN_HASH_PEPPER: ${NIN_HASH_PEPPER:-${SECRET_KEY}}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      PORTAL_URL: ${PORTAL_URL:-https://mboempowerment.com}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-True}
      JWT_COOKIE_SAMESITE: ${JWT_COOKIE_SAMESITE:-None}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
      CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-False}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-600}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-60}
      PAYSTACK_MOCK_MODE: ${PAYSTACK_MOCK_MODE:-False}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      ZEPTO_MOCK_MODE: ${ZEPTO_MOCK_MODE:-False}
      ZEPTO_API_KEY: ${ZEPTO_API_KEY:-}
      ZEPTO_SENDER_EMAIL: ${ZEPTO_SENDER_EMAIL:-no-reply@mboempowerment.com}
      ZEPTO_SENDER_NAME: ${ZEPTO_SENDER_NAME:-Mbo Youth Empowerment}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-dwn6p3qmd}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@mboempowerment.com}
    command: sh -c "python manage.py migrate --no-input && gunicorn config.wsgi:application --bind 0.0.0.0:8080 --workers 3 --timeout 60"
    expose:
      - "8080"
    depends_on:
      redis:
        condition: service_started
    networks:
      - default
      - coolify
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health/', timeout=5).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Celery worker ─────────────────────────────────────────────────────
  worker:
    build:
      context: ./mbo_youth_emp
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      CELERY_BROKER_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PAYSTACK_MOCK_MODE: ${PAYSTACK_MOCK_MODE:-False}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      ZEPTO_MOCK_MODE: ${ZEPTO_MOCK_MODE:-False}
      ZEPTO_API_KEY: ${ZEPTO_API_KEY:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-dwn6p3qmd}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    command: celery -A config worker -l info
    depends_on:
      - redis
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --timeout 5 | grep -q 'OK'"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Reverse proxy ─────────────────────────────────────────────────────
  # Managed by Coolify's built-in proxy (Traefik by default). Do NOT run a
  # proxy container here — it would fight Coolify's proxy for ports 80/443.
  # Set each service's domain in the Coolify UI instead:
  #   frontend -> https://mboempowerment.com  (port 3000)
  #   backend  -> https://back.mboempowerment.com (port 8080)

volumes:
  redisdata:

networks:
  # Coolify's proxy network. Must be external and pre-created by Coolify so
  # its reverse proxy can route traffic to the frontend/backend containers.
  coolify:
    external: true
